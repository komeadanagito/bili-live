name: Release

# 触发方式：
#   1. 手动触发（Actions 页面 Run workflow）
#   2. 推送 v* 标签时自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # 各平台并行构建，产物自动上传到对应版本的 Release
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux：产出 AppImage 与 deb
            args: ''
          - platform: windows-latest # Windows：产出 NSIS 安装包
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bili Live v__VERSION__'
          releaseBody: |
            本次发布由 GitHub Actions 自动构建，包含 Windows 与 Linux 桌面版。

            - Windows：`*_x64-setup.exe`（NSIS 安装向导）
            - Linux：`*.AppImage`（免安装单文件）、`*.deb`（Debian / Ubuntu 安装包）

            详见仓库 README 的平台说明。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}