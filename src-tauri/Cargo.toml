[package]
name = "bili-live-desktop"
version = "0.1.2"
description = "Bilibili live control and message desktop client"
edition = "2021"
default-run = "bili-live-desktop"

[lib]
name = "bili_live_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
brotli = "8"
md5 = "0.7"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
prost = "0.13"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

[[bin]]
name = "bili-live-desktop"
path = "src/main.rs"

[[bin]]
name = "bili-live-web"
path = "src/bin/web.rs"

